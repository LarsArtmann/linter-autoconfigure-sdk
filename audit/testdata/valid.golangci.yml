version: "2"
linters:
  enable:
    - gosec
  disable:
    - depguard
  settings:
    gosec:
      excludes:
        - G304
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - staticcheck
          - errcheck
      - path: gen/
        linters:
          - depguard
formatters:
  enable:
    - gci
  settings:
    gci:
      sections:
        - standard
