# MD013 line-length tuning.
#
# Tables are exempt: wide comparison tables are intentional and MD060 expects
# their pipes aligned, which pads rows past any line limit. Code blocks are
# exempt for the same reason. Historical reports under docs/status/ are
# point-in-time records that must not be rewritten; they carry their own
# .markdownlint.yml disabling MD013.
MD013:
  line_length: 120
  tables: false
  code_blocks: false
# Changelogs repeat "Added"/"Changed" per version section by convention; only
# flag duplicates among siblings within the same section.
MD024:
  siblings_only: true
