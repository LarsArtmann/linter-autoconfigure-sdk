# BuildFlow Configuration
# See: https://github.com/larsartmann/buildflow

# Build mode: full, fast, ci, dev, pre-commit
build_mode: full

# Concurrency
max_concurrency: 4

# File settings
max_file_size: 350 # lines
dupl_threshold: 30 # tokens

# TODO pattern minimum severity: info, warning, error, critical
# info = all patterns, warning = skip TODO/NOTE/OPTIMIZE, error = only FIXME/XXX/BUG, critical = BUG only
todo_min_severity: info

# Patterns to exclude from checks
exclude:
  - vendor
  - .git
  - node_modules
  - .next
  - dist
  - "*.pb.go"
  - "*.gen.go"
  # Historical records: status reports and archived planning docs are
  # point-in-time snapshots. Rewriting them (even reformatting) would falsify
  # the record, and their links rot by design, so all doc checks skip them.
  # markdownlint-cli has no hierarchical config, so this is the only clean
  # mechanism; live docs stay covered (see .markdownlint.yml).
  - docs/status/**
  - docs/planning/**

# Auto-fix settings
auto_fix: false

# Skipped tools with reasons (each entry MUST carry its why):
# - license-check: go-licenses cannot parse the go 1.27 toolchain stdlib
#   ("Package os/exec does not have module info"); documented SDK AGENTS.md.
#   Re-enable when the tool learns go 1.27.
# - go-structure-linter: flags the intentional flat layout (all files at
#   root: the whole module is public API, documented in AGENTS.md "Flat
#   layout is intentional" and the .golangci.yml header). Re-enable only if
#   the layout decision is reversed.
skip_steps:
  - license-check
  - go-structure-linter

# Logging
verbose: false
log_level: info
