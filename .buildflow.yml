# BuildFlow Configuration — non-default settings only.
#
# Historical/archival doc trees are point-in-time snapshots: rewriting them
# (even reformatting) would falsify the record, and their links rot by design,
# so all doc checks skip them. markdownlint-cli has no hierarchical config, so
# this is the only clean mechanism; live docs stay covered (see
# .markdownlint.yml).
exclude:
  - docs/status/**
  - docs/planning/**

# license-check: go-licenses cannot parse the go 1.27 toolchain stdlib
# ("Package os/exec does not have module info"); documented SDK AGENTS.md.
# Re-enable when the tool learns go 1.27.
# go-structure-linter: flags the intentional flat layout (all files at root:
# the whole module is public API, documented in AGENTS.md "Flat layout is
# intentional" and the .golangci.yml header). Re-enable only if the layout
# decision is reversed.
skip_steps:
